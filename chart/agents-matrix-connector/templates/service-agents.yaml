{{- /* The api's agent listener (/chat/v1, bearer token), for in-cluster callers; the bot has no Service. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-matrix-connector.fullname" . }}-api-agents
  labels:
    {{- include "agents-matrix-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: agents
      port: {{ .Values.agentApi.port }}
      targetPort: agents
      protocol: TCP
  selector:
    {{- include "agents-matrix-connector.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
