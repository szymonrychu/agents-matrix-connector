{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
{{- $host := required "ingress.host is required when ingress.enabled" $ing.host }}
{{- $tls := $ing.tls | default dict }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agents-matrix-connector.fullname" . }}-api
  labels:
    {{- include "agents-matrix-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $tls.secretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /matrix/api
            pathType: Prefix
            backend:
              service:
                name: {{ include "agents-matrix-connector.fullname" . }}-api
                port:
                  number: {{ .Values.service.port }}
{{- end }}
