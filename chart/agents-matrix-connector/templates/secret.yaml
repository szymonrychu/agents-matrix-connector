{{- $o := .Values.orchestrator }}
{{- $m := .Values.matrix }}
{{- $a := .Values.agentApi }}
{{- $db := and .Values.postgres.url (not .Values.postgres.existingSecret) }}
{{- $tok := and $o.token (not (and $o.tokenSecret $o.tokenSecret.name)) }}
{{- $mx := and $m.accessToken (not (and $m.accessTokenSecret $m.accessTokenSecret.name)) }}
{{- $agent := and $a.tokenSha256 (not (and $a.tokenSecret $a.tokenSecret.name)) }}
{{- if or $db $tok $mx $agent }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-matrix-connector.fullname" . }}
  labels:
    {{- include "agents-matrix-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $db }}
  database-url: {{ .Values.postgres.url | quote }}
  {{- end }}
  {{- if $tok }}
  orchestrator-token: {{ $o.token | quote }}
  {{- end }}
  {{- if $mx }}
  matrix-access-token: {{ $m.accessToken | quote }}
  {{- end }}
  {{- if $agent }}
  {{- $_ := include "agents-matrix-connector.agentTokenSecretName" . }}
  agent-token-sha256: {{ $a.tokenSha256 | quote }}
  {{- end }}
{{- end }}
