{{- /* Only the api is exposed; the bot has no Service. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-matrix-connector.fullname" . }}-api
  labels:
    {{- include "agents-matrix-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agents-matrix-connector.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
