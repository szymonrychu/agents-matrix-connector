{{- $tag := required "image.tag is required (set image.tag)" .Values.image.tag }}
{{- $image := printf "%s:%s" .Values.image.repository $tag }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- range $component := list "api" "bot" }}
{{- $cfg := index $.Values.components $component }}
{{- $labels := dict "context" $ "component" $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-matrix-connector.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-matrix-connector.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if eq $component "bot" }}
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ $cfg.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agents-matrix-connector.componentLabels" $labels | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agents-matrix-connector.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agents-matrix-connector.imagePullSecrets" $ | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["agents-matrix-connector"]
          args: ["migrate"]
          {{- include "agents-matrix-connector.env" (dict "context" $ "component" "migrate") | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["agents-matrix-connector"]
          args: [{{ $component | quote }}]
          {{- include "agents-matrix-connector.env" $labels | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component "bot" }}
            - name: matrix-token
              mountPath: /var/run/secrets/matrix
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $component "bot" }}
        - name: matrix-token
          secret:
            secretName: {{ include "agents-matrix-connector.matrixSecretName" $ }}
            defaultMode: 0440
            items:
              - key: {{ include "agents-matrix-connector.matrixSecretKey" $ }}
                path: token
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
